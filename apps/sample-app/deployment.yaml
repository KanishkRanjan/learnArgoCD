apiVersion: apps/v1
kind: Deployment
metadata: 
  name: my-sample-app
  namespace: default
  labels:
    app: my-sample-app
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: my-sample-app 
    template:
      metadata:
        labels:
          app: my-sample-app
      spec: 
        containers:
        - name: web
          image: nginx:alpine
          ports:
          - containerPort: 80
          